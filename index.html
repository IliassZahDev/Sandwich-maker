<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/general.css">
  <link rel="stylesheet" href="style/header.css">
  <script src="app.js" defer></script>
  <title>Sandwich Maker</title>
</head>
<body>

  <header class="flex-item">
    <div class="left-section">
      <span class="first-letter">S</span>andwich
      <span class="first-letter">M</span>aker
    </div>
    <div class="right-section">
      <span class="first-name">iliass</span>
      <span class="last-name">zaher</span>
      <span class="filiere">Aseds</span>
    </div>
  </header>

  <main class="flex-item">
    <nav>
      <div class="nav-head">inventaire</div>
      <ul class="ingredients-list">
        <li class="ingredients-item flex-item">
          <p class="ingr-name">tomate</p>
          <div class="ingr-price">0.9<span class="unit">dh</span></div>
          <div class="ingr-article"><div class="toamte">tomate</div></div>
        </li>
        <li class="ingredients-item flex-item">
          <p class="ingr-name">oignon rouge</p>
          <div class="ingr-price">1.95<span class="unit">dh</span></div>
          <div class="ingr-article"><div class="toamte">oignon rouge</div></div>
        </li>
        <li class="ingredients-item flex-item">
          <p class="ingr-name">cheddar</p>
          <div class="ingr-price">0.75<span class="unit">dh</span></div>
          <div class="ingr-article"><div class="toamte">cheddar</div></div>
        </li>
      </ul>
    </nav>
  </main>
  
</body>
</html>
